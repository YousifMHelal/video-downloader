name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Smoke-test the engine
        run: python -c "import app.core, app.store; print(app.core.QUALITY_LABELS)"

      - name: Build the executable
        run: python tools/build_exe.py --no-shortcuts

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-windows
          path: "dist/Video Downloader.exe"
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/Video Downloader.exe"
